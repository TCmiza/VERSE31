<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>LibraryVerse31 | Rak Maya PSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#071426;--panel:rgba(13,33,58,.78);--cyan:#25d9ff;--blue:#4f8cff;--purple:#9b6cff;--text:#eef7ff;--muted:#a8bdd2;--line:rgba(255,255,255,.12);--shadow:0 24px 70px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 85% 2%,rgba(68,88,214,.38),transparent 28rem),radial-gradient(circle at 5% 75%,rgba(127,47,188,.25),transparent 30rem),var(--bg)}
    body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
    a{color:inherit;text-decoration:none}.shell{width:min(1120px,calc(100% - 28px));margin:auto}.glass{background:linear-gradient(140deg,rgba(255,255,255,.1),rgba(255,255,255,.045));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}.brand{font:800 26px Poppins;letter-spacing:1.5px}.brand span{color:var(--cyan)}.home{padding:10px 15px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:14px}
    header{text-align:center;padding:55px 0 28px}.kicker{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:10px 0 8px;font:800 clamp(36px,7vw,64px)/1.05 Poppins;background:linear-gradient(100deg,#fff,var(--cyan),#b89cff);-webkit-background-clip:text;background-clip:text;color:transparent}header p{max-width:650px;margin:auto;color:var(--muted);line-height:1.65}
    .tools{display:grid;grid-template-columns:1fr 240px;gap:12px;margin:26px auto 30px;max-width:820px}.tools input,.tools select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(7,20,38,.82);color:var(--text);font:inherit;outline:none}.tools input:focus,.tools select:focus{border-color:var(--cyan)}
    .status{text-align:center;color:var(--muted);margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:70px}.book{overflow:hidden;border-radius:22px;transition:.2s ease;cursor:pointer}.book:hover{transform:translateY(-5px);border-color:rgba(37,217,255,.38)}.cover{position:relative;aspect-ratio:4/5.45;background:linear-gradient(145deg,#132b49,#221d4c);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,rgba(3,10,20,.8))}.badge{position:absolute;z-index:1;left:12px;bottom:12px;padding:6px 10px;border-radius:999px;background:rgba(7,20,38,.82);border:1px solid rgba(255,255,255,.18);font-size:11px;font-weight:700}.info{padding:17px}.info h2{margin:0 0 7px;font:700 17px/1.35 Poppins}.meta{color:var(--muted);font-size:13px}.read{display:inline-block;margin-top:14px;color:var(--cyan);font-size:13px;font-weight:800}.empty{grid-column:1/-1;padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
    dialog{width:min(1100px,calc(100% - 22px));height:min(90vh,850px);padding:0;border:1px solid var(--line);border-radius:20px;background:#071426;color:var(--text);box-shadow:0 30px 100px rgba(0,0,0,.55)}dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(5px)}.reader-head{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.reader-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{border:1px solid var(--line);background:rgba(255,255,255,.08);color:white;border-radius:999px;padding:8px 13px;cursor:pointer}.reader-frame{width:100%;height:calc(100% - 60px);border:0;background:white}
    footer{text-align:center;padding:30px;color:var(--muted);border-top:1px solid var(--line);font-size:13px}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr;gap:12px}.info{padding:13px}.info h2{font-size:14px}.cover{aspect-ratio:4/5.6}.home{font-size:12px;padding:8px 11px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="shell"><a class="brand" href="index.html">LIBRARY<span>VERSE31</span></a><a class="home" href="index.html">← HOMEVERSE</a></nav>
  <main class="shell">
    <header><span class="kicker">Pusat Sumber SK Blok 31 Tawau</span><h1>Rak Maya Digital</h1><p>Koleksi buku digital yang dikemas kini secara automatik daripada pangkalan data Pusat Sumber.</p></header>
    <section class="tools" aria-label="Carian buku"><input id="search" type="search" placeholder="Cari tajuk buku…" autocomplete="off"><select id="category"><option value="">Semua kategori</option></select></section>
    <p class="status" id="status">Memuatkan koleksi buku…</p>
    <section class="grid" id="book-grid" aria-live="polite"></section>
  </main>
  <dialog id="reader"><div class="reader-head"><strong id="reader-title">Baca buku</strong><button class="close" id="close-reader" type="button">Tutup ✕</button></div><iframe class="reader-frame" id="reader-frame" title="Pembaca PDF" allow="autoplay"></iframe></dialog>
  <footer>LibraryVerse31 · Ekosistem Digital PSS SK Blok 31</footer>
  <script>
    const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vQdVn2e39_LwvlFpSLcRXUYlzmOJm69eGqBsyB3rHSYtRDD6BOGQBjzeGDJfnjZQwa_vIM82bh_YpBi/pub?output=csv';
    let books=[];
    const grid=document.querySelector('#book-grid'),statusEl=document.querySelector('#status'),searchEl=document.querySelector('#search'),categoryEl=document.querySelector('#category'),reader=document.querySelector('#reader'),frame=document.querySelector('#reader-frame');
    function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===','&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
    function toObjects(rows){const heads=(rows.shift()||[]).map(x=>x.trim().toLowerCase());return rows.map(row=>Object.fromEntries(heads.map((h,i)=>[h,(row[i]||'').trim()]))) }
    function driveId(url=''){return url.match(/\/d\/([\w-]+)/)?.[1]||url.match(/[?&]id=([\w-]+)/)?.[1]||''}
    function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){const term=searchEl.value.trim().toLowerCase(),cat=categoryEl.value;const shown=books.filter(b=>(!term||b.title.toLowerCase().includes(term))&&(!cat||b.kategori===cat));statusEl.textContent=`${shown.length} buku dipaparkan`;grid.innerHTML=shown.length?shown.map(b=>{const id=driveId(b['pdf link']);return `<article class="book glass" tabindex="0" role="button" data-id="${esc(id)}" data-title="${esc(b.title)}"><div class="cover"><img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w800" alt="Kulit buku ${esc(b.title)}" loading="lazy"><span class="badge">${esc(b.kategori||'Buku Digital')}</span></div><div class="info"><h2>${esc(b.title)}</h2><div class="meta">${esc(b.tahun||'')}</div><span class="read">Baca sekarang →</span></div></article>`}).join(''):'<div class="empty">Tiada buku yang sepadan dengan carian.</div>'}
    function openBook(card){const id=card.dataset.id;if(!id)return;document.querySelector('#reader-title').textContent=card.dataset.title;frame.src=`https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;reader.showModal()}
    grid.addEventListener('click',e=>{const card=e.target.closest('.book');if(card)openBook(card)});grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.book')){e.preventDefault();openBook(e.target)}});document.querySelector('#close-reader').onclick=()=>reader.close();reader.addEventListener('close',()=>frame.src='');searchEl.addEventListener('input',render);categoryEl.addEventListener('change',render);
    fetch(SHEET,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(text=>{books=toObjects(parseCSV(text)).filter(b=>['ACTIVE','AKTIF'].includes((b.status||'').toUpperCase())&&driveId(b['pdf link']));const cats=[...new Set(books.map(b=>b.kategori).filter(Boolean))].sort();categoryEl.innerHTML='<option value="">Semua kategori</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');render()}).catch(()=>{statusEl.textContent='Koleksi tidak dapat dimuatkan buat masa ini. Sila cuba lagi.';grid.innerHTML='<div class="empty">Data rak maya tidak tersedia.</div>'});
  </script>
</body>
</html>
