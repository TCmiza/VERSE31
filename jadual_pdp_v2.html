class="empty">Sambungan data tidak tersedia.</div>'}}function openCard(c){$('#viewerTitle').textContent=c.dataset.title;$('#reader').src=c.dataset.src;$('#viewer').showModal()}grid.onclick=e=>{const c=e.target.closest('.card');if(c)openCard(c)};grid.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();openCard(e.target)}};$('#close').onclick=()=>$('#viewer').close();$('#viewer').addEventListener('close',()=>$('#reader').src='');$('#prev').onclick=()=>{if(page>1){page--;load();scrollTo({top:0,behavior:'smooth'})}};$('#next').onclick=()=>{page++;load();scrollTo({top:0,behavior:'smooth'})};search.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;load()},350)};cat.onchange=()=>{page=1;load()};load();
